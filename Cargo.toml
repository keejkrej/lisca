[workspace]
resolver = "2"
members = [
  "crates/lisca",
  "crates/lisca-server",
  "crates/lisca-tauri",
  "apps/aligner/server",
  "apps/annotator/server",
  "apps/studio/server",
  "apps/aligner/desktop/src-tauri",
  "apps/annotator/desktop/src-tauri",
  "apps/studio/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lisca/lisca"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
czi-rs = { git = "https://github.com/keejkrej/czi-rs" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ndarray = { version = "0.17", features = ["std"] }
ndarray-stats = "0.7"
noisy_float = "0.2"
ort = { version = "=2.0.0-rc.11", default-features = false, features = [
  "std",
  "ndarray",
  "download-binaries",
  "tls-rustls",
  "copy-dylibs",
] }
nd2-rs = { git = "https://github.com/keejkrej/nd2-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.10"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
uuid = { version = "1", features = ["v4"] }
csv = "1.3"
rayon = "1.10"
mplot = { git = "https://github.com/keejkrej/mplot-rs" }
rust_xlsxwriter = "0.90"
lisca = { path = "crates/lisca", default-features = false }
lisca-server = { path = "crates/lisca-server" }
# Transfection analysis (Otsu segment, timeseries, AUC, fit, plots).
# ndarray 0.16 / imageproc 0.25 in that crate; this workspace stays on 0.17 / 0.27.
# Call workspace-path APIs so ndarray types are not unified across the boundary.
lisca-transfection = { git = "https://github.com/keejkrej/lisca-transfection-assay", rev = "a370d7f1f7ae760055a93a47d14b4200a2c9852b" }
tauri = "2"
tauri-build = "2"


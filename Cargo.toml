[workspace]
resolver = "2"
members = [
  "crates/lisca",
  "crates/lisca-workspace",
  "crates/lisca-server",
  "crates/lisca-tauri",
  "apps/aligner/server",
  "apps/annotator/server",
  "apps/studio/server",
  "apps/aligner/desktop/src-tauri",
  "apps/annotator/desktop/src-tauri",
  "apps/studio/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lisca/lisca"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
czi = { git = "https://github.com/keejkrej/czi-rs", rev = "19b54c0e4d4278e1b781388a76930b8a01170014", version = "1.0.0" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ndarray = { version = "0.17", features = ["std"] }
ndarray-stats = "0.7"
ort = { version = "=2.0.0-rc.11", default-features = false, features = [
  "std",
  "ndarray",
  "download-binaries",
  "tls-rustls",
  "copy-dylibs",
] }
nd2 = { git = "https://github.com/keejkrej/nd2-rs", rev = "67f1f15e3e72d742111558396a9b008de2de8d98", version = "1.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.10"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
uuid = { version = "1", features = ["v4"] }
csv = "1.3"
rayon = "1.10"
mplot = { git = "https://github.com/keejkrej/mplot-rs", rev = "b5f3690f7410fa67709621b564b51272f5b3b6e9", version = "1.0.0" }
marray = { git = "https://github.com/keejkrej/marray-rs", rev = "af67ac2d833f55e069f286022d0a0de0b9547bfb", version = "1.0.0", default-features = false }
lisca = { path = "crates/lisca", default-features = false }
lisca-workspace = { path = "crates/lisca-workspace" }
lisca-server = { path = "crates/lisca-server" }
# Transfection analysis (Otsu segment, traces, AUC, fit, plots).
# ndarray 0.16 / imageproc 0.25 in that crate; this workspace stays on 0.17 / 0.27.
# Call workspace-path APIs so ndarray types are not unified across the boundary.
lisca-transfection = { git = "https://github.com/keejkrej/lisca-transfection-assay", rev = "0a127d425f5e97f353b503b962ce4e7b2affa4d1" }
# Death-reporter fluorescence, fluorescent engagement, and the killing
# classifier (predict, clean, kill curve). Python `killing` in that repo is
# the same definitions. Lisca does not depend on it: the package also pulls
# the label-free training stack.
lisca-killing = { git = "https://github.com/keejkrej/lisca-killing-assay", rev = "0d1d750e04ed5ec3fa1cbedb8ad9320b8103c3e4" }
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"


[workspace]
resolver = "2"
members = ["crates/lisca", "apps/aligner/server", "apps/annotator/server", "apps/studio/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lisca/lisca"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
czi-rs = { git = "https://github.com/keejkrej/czi-rs", features = ["smb"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
nd2-rs = { git = "https://github.com/keejkrej/nd2-rs", features = ["smb"] }
mdat-smb-rs = { git = "https://github.com/keejkrej/mdat-smb-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
smb2 = "0.10"
uuid = { version = "1", features = ["v4"] }
csv = "1.3"
rayon = "1.10"
plotpy = "1.22"
rust_xlsxwriter = "0.90"
lisca = { path = "crates/lisca" }

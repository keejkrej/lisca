[workspace]
resolver = "2"
members = [
    "crates/imaging-smb-io",
    "crates/lisca",
    "apps/aligner-server",
    "apps/annotator-server",
    "apps/studio-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lisca/lisca"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
czi-rs = { path = "../czi-rs", features = ["smb"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
nd2-rs = { path = "../nd2-rs", features = ["smb"] }
imaging-smb-io = { path = "crates/imaging-smb-io" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
smb2 = "0.10"
uuid = { version = "1", features = ["v4"] }
specta = { version = "2.0.0-rc.25", features = ["derive", "collect"] }
specta-serde = "0.0.12"
specta-typescript = "0.0.12"
lisca = { path = "crates/lisca" }

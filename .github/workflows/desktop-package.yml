name: Desktop package

# Shared Studio/desktop packaging. Called by Release (stable channel) and
# Desktop build (test channel). Not run on its own.

on:
  workflow_call:
    inputs:
      upload_target:
        description: release uploads to the tag's GitHub Release; artifact uploads an Actions artifact
        required: true
        type: string
      os:
        description: macos, windows, linux, or all
        required: false
        type: string
        default: all
      products:
        description: JSON array of desktop products to package
        required: false
        type: string
        default: '["studio"]'

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: ${{ matrix.product }} / ${{ matrix.os }}
    if: inputs.os == 'all' || (inputs.os == 'macos' && matrix.os == 'macos-latest') || (inputs.os == 'windows' && matrix.os == 'windows-latest') || (inputs.os == 'linux' && matrix.os == 'ubuntu-latest')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(inputs.products) }}
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Require a known upload target
        if: inputs.upload_target != 'release' && inputs.upload_target != 'artifact'
        run: |
          echo "::error::upload_target must be release or artifact (got ${{ inputs.upload_target }})"
          exit 1

      - uses: actions/checkout@v4

      # Installs the pnpm version pinned by package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfontconfig1-dev \
            fakeroot \
            dpkg

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Studio killing model
        # Killing-assay ONNX (HF); package-time cache only — not a product brain.
        if: matrix.product == 'studio'
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 2 "https://huggingface.co/keejkrej/killing-assay-resnet18/resolve/main/model.onnx" \
            -o ./models/killing-assay-resnet18/model.onnx
          test -s models/killing-assay-resnet18/model.onnx

      # Without these, Tauri leaves only the linker's ad-hoc signature on the executable and
      # macOS reports the downloaded app as "damaged". Fail rather than ship that.
      - name: Check macOS signing secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions secret ${name} (see docs/agents/releases.md)"
              missing=1
            fi
          done
          exit "${missing}"

      # Tauri imports the certificate into a temporary keychain, signs the bundle with the
      # hardened runtime, notarizes and staples the .app, then builds and signs the DMG.
      - name: Package desktop app
        env:
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: pnpm run dist:${{ matrix.product }}

      # Tauri 2.11 leaves the signed DMG itself unnotarized (tauri-apps/tauri#15822), so submit
      # and staple the DMG that gets uploaded.
      - name: Notarize macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=("apps/${{ matrix.product }}/desktop/release/dmg/"*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected one DMG, found ${#dmgs[@]}" >&2
            exit 1
          fi
          xcrun notarytool submit "${dmgs[0]}" \
            --apple-id "${APPLE_ID}" --password "${APPLE_PASSWORD}" --team-id "${APPLE_TEAM_ID}" \
            --wait --timeout 30m
          xcrun stapler staple "${dmgs[0]}"

      # Check the app users install, inside the DMG; with only the dmg target Tauri does not
      # keep a loose .app in the release directory.
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=("apps/${{ matrix.product }}/desktop/release/dmg/"*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected one DMG, found ${#dmgs[@]}" >&2
            exit 1
          fi
          codesign --verify --strict --verbose=2 "${dmgs[0]}"
          xcrun stapler validate "${dmgs[0]}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${dmgs[0]}"
          mnt="$(mktemp -d)"
          hdiutil attach "${dmgs[0]}" -readonly -nobrowse -mountpoint "${mnt}" >/dev/null
          trap 'hdiutil detach "${mnt}" >/dev/null' EXIT
          apps=("${mnt}/"*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected one .app in the DMG, found ${#apps[@]}" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          spctl --assess --type execute --verbose=4 "${apps[0]}"

      - name: Find installer
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          product="${{ matrix.product }}"
          dest="apps/${product}/desktop/release"
          short="${GITHUB_SHA::7}"
          case "${RUNNER_OS}" in
            macOS)
              os=macos
              files=("${dest}"/dmg/*.dmg)
              ext=dmg
              ;;
            Windows)
              os=windows
              files=("${dest}"/nsis/*.exe)
              ext=exe
              ;;
            Linux)
              os=linux
              files=("${dest}"/deb/*.deb)
              ext=deb
              ;;
            *) echo "unsupported OS ${RUNNER_OS}" >&2; exit 1 ;;
          esac
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected one installer under ${dest}, found ${#files[@]}" >&2
            ls -R "${dest}" || true
            exit 1
          fi
          staged="${product}-${os}-${short}.${ext}"
          cp "${files[0]}" "${staged}"
          echo "source=${files[0]}" >> "$GITHUB_OUTPUT"
          echo "name=${product}-${os}-${short}" >> "$GITHUB_OUTPUT"
          echo "staged=${staged}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        if: inputs.upload_target == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "${{ steps.installer.outputs.source }}" --clobber

      - name: Upload test artifact
        if: inputs.upload_target == 'artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.installer.outputs.name }}
          path: ${{ steps.installer.outputs.staged }}
          retention-days: 14
          if-no-files-found: error

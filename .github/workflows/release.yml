name: Release

# Landing already deploys from deploy/landing via Render (pnpm run deploy:landing).
# Notebook zips ship from notebooks-v* tags via release-jupyternotebook.yml, not this workflow.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify desktop release versions
        run: node --experimental-strip-types scripts/check-release-version.ts "${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Desktop installers.

            | App | macOS | Windows | Linux |
            | --- | --- | --- | --- |
            | Studio | DMG | NSIS | deb |
            | Aligner | DMG | NSIS | deb |
            | Annotator | DMG | NSIS | deb |

            macOS builds are signed with a Developer ID and notarized by Apple. Windows builds are not
            signed yet, so SmartScreen will warn.

            Linux is Debian/Ubuntu `.deb` only. There is no AppImage, rpm, or pacman package.

  publish:
    name: ${{ matrix.product }} / ${{ matrix.os }}
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        product: [studio, aligner, annotator]
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned by package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfontconfig1-dev \
            fakeroot \
            dpkg

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Studio killing model
        # Killing-assay ONNX (HF); package-time cache only — not a product brain.
        if: matrix.product == 'studio'
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 2 "https://huggingface.co/keejkrej/killing-assay-resnet18/resolve/main/model.onnx" \
            -o ./models/killing-assay-resnet18/model.onnx
          test -s models/killing-assay-resnet18/model.onnx

      # Without these, Tauri leaves only the linker's ad-hoc signature on the executable and
      # macOS reports the downloaded app as "damaged". Fail rather than ship that.
      - name: Check macOS signing secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions secret ${name} (see docs/agents/releases.md)"
              missing=1
            fi
          done
          exit "${missing}"

      # Tauri imports the certificate into a temporary keychain, signs the bundle with the
      # hardened runtime, notarizes it, and staples the ticket before building the DMG.
      - name: Package desktop app
        env:
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: pnpm run dist:${{ matrix.product }}

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=("apps/${{ matrix.product }}/desktop/release/macos/"*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected one .app bundle, found ${#apps[@]}" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
          spctl --assess --type execute --verbose=4 "${apps[0]}"

      - name: Upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          product="${{ matrix.product }}"
          dest="apps/${product}/desktop/release"
          shopt -s nullglob
          case "${RUNNER_OS}" in
            macOS) files=("${dest}"/dmg/*.dmg) ;;
            Windows) files=("${dest}"/nsis/*.exe) ;;
            Linux) files=("${dest}"/deb/*.deb) ;;
            *) echo "unsupported OS ${RUNNER_OS}" >&2; exit 1 ;;
          esac
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installers under ${dest}" >&2
            ls -R "${dest}" || true
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber

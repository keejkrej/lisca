name: Release

# Stable channel. A v* tag publishes a GitHub Release. Test installers come from
# Desktop build (workflow_dispatch) and are not releases or auto-update sources.
# Landing already deploys from deploy/landing via Render (pnpm run deploy:landing).
# Notebook zips ship from notebooks-v* tags via release-jupyternotebook.yml, not this workflow.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify desktop release versions
        run: node --experimental-strip-types scripts/check-release-version.ts "${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Desktop installers.

            | App | macOS | Windows | Linux |
            | --- | --- | --- | --- |
            | Studio | DMG | NSIS | deb |
            | Aligner | DMG | NSIS | deb |
            | Annotator | DMG | NSIS | deb |

            macOS builds are signed with a Developer ID and notarized by Apple. Windows builds are not
            signed yet, so SmartScreen will warn.

            Linux is Debian/Ubuntu `.deb` only. There is no AppImage, rpm, or pacman package.

  package:
    needs: release
    uses: ./.github/workflows/desktop-package.yml
    with:
      upload_target: release
      os: all
      products: '["studio", "aligner", "annotator"]'
    secrets: inherit

name: Notebooks release

# Pack from main (monorepo). Tag notebooks-v* on the notebooks export commit, not main.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected SemVer from notebooks/VERSION on main (e.g. 0.1.2)."
        required: true
        type: string

concurrency:
  group: notebooks-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: pack-from-main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main (monorepo pack sources)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require monorepo pack tree
        run: |
          set -euo pipefail
          if [[ ! -f scripts/pack-notebooks.sh || ! -f python/pyproject.toml || ! -f Cargo.lock ]]; then
            echo "Packing must run from a main monorepo checkout (python/, Cargo.lock, scripts/pack-notebooks.sh)." >&2
            exit 1
          fi

      - name: Read VERSION
        id: version
        env:
          EXPECTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < notebooks/VERSION)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Notebooks VERSION on main is ${version}"
          if [[ "$EXPECTED" != "$version" ]]; then
            echo "workflow_dispatch version '$EXPECTED' does not match notebooks/VERSION '$version'" >&2
            exit 1
          fi

      - name: Pack zip
        id: pack
        run: |
          set -euo pipefail
          chmod +x scripts/pack-notebooks.sh scripts/sync-notebooks-vendor.sh scripts/publish-notebooks-branch.sh
          zip_path="$(bash scripts/pack-notebooks.sh)"
          echo "zip_path=${zip_path}" >> "$GITHUB_OUTPUT"
          unzip -Z1 "$zip_path"

      - name: Publish branch notebooks and tag export commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(bash scripts/publish-notebooks-branch.sh --tag "${{ steps.pack.outputs.zip_path }}")"
          echo "Published notebooks export $sha as notebooks-v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: notebooks-v${{ steps.version.outputs.version }}
          name: Notebooks ${{ steps.version.outputs.version }}
          make_latest: false
          fail_on_unmatched_files: true
          files: ${{ steps.pack.outputs.zip_path }}
          body: |
            Jupyter notebooks zip for Hub and local use. Not desktop installers.

            Preferred: `curl -fsSL https://raw.githubusercontent.com/keejkrej/lisca/main/scripts/get-notebooks.sh | bash` (Windows: `irm https://raw.githubusercontent.com/keejkrej/lisca/main/scripts/get-notebooks.ps1 | iex`). That downloads portable Git into `.tools/git` and clones branch `notebooks`. Zip extract is `--zip` / airgapped only.

            Update: `bash update.sh` uses the same portable Git (zip extracts bootstrap onto branch `notebooks`). Do not clone `main`.

            Tag `notebooks-v${{ steps.version.outputs.version }}` points at the export commit on branch `notebooks`. Daily work stays on `main`. Desktop installers ship from `v*` tags.

name: Notebooks release

# Zip-only Jupyter notebooks. Desktop installers stay on v* → release.yml.

on:
  push:
    tags:
      - "notebooks-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Expected SemVer from notebooks/VERSION (e.g. 0.1.0). Tag push is the publish path."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: notebooks-zip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < notebooks/VERSION)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Notebooks VERSION is ${version}"

      - name: Verify workflow_dispatch version input
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          EXPECTED: ${{ inputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$EXPECTED" != "$VERSION" ]; then
            echo "workflow_dispatch version '$EXPECTED' does not match notebooks/VERSION '$VERSION'" >&2
            exit 1
          fi

      - name: Verify tag notebooks-vX.Y.Z matches VERSION
        if: startsWith(github.ref, 'refs/tags/notebooks-v')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          expected="notebooks-v${VERSION}"
          if [ "$TAG" != "$expected" ]; then
            echo "Tag '$TAG' does not match notebooks/VERSION '$VERSION' (expected '$expected')" >&2
            exit 1
          fi

      - name: Pack zip
        id: pack
        run: |
          set -euo pipefail
          chmod +x scripts/pack-notebooks.sh
          zip_path="$(bash scripts/pack-notebooks.sh)"
          echo "zip_path=${zip_path}" >> "$GITHUB_OUTPUT"
          unzip -Z1 "$zip_path"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/notebooks-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Notebooks ${{ steps.version.outputs.version }}
          make_latest: false
          fail_on_unmatched_files: true
          files: ${{ steps.pack.outputs.zip_path }}
          body: |
            Jupyter notebooks zip for Hub and local use. Not desktop installers.

            Download `lisca-notebooks-${{ steps.version.outputs.version }}.zip`, extract it, then `bash install.sh` (Windows: `.\install.ps1`). Do not clone this monorepo.

            Desktop Studio, Aligner, and Annotator installers ship from `v*` tags, not this release.

      - name: Upload zip artifact
        if: ${{ github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/notebooks-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: lisca-notebooks-${{ steps.version.outputs.version }}
          path: ${{ steps.pack.outputs.zip_path }}

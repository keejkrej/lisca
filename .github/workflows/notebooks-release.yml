name: Notebooks release

# Pack from main (monorepo). Tag notebooks-v* on the notebooks export branch, not main.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected SemVer from notebooks/VERSION on main (e.g. 0.1.2)."
        required: true
        type: string
  push:
    tags:
      - "notebooks-v*"

concurrency:
  group: notebooks-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  export:
    name: pack-from-main
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main (monorepo pack sources)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require monorepo pack tree
        run: |
          set -euo pipefail
          if [[ ! -f scripts/pack-notebooks.sh || ! -f python/pyproject.toml || ! -f Cargo.lock ]]; then
            echo "Packing must run from a main monorepo checkout (python/, Cargo.lock, scripts/pack-notebooks.sh)." >&2
            exit 1
          fi

      - name: Read VERSION
        id: version
        env:
          EXPECTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < notebooks/VERSION)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Notebooks VERSION on main is ${version}"
          if [[ "$EXPECTED" != "$version" ]]; then
            echo "workflow_dispatch version '$EXPECTED' does not match notebooks/VERSION '$version'" >&2
            exit 1
          fi

      - name: Pack zip
        id: pack
        run: |
          set -euo pipefail
          chmod +x scripts/pack-notebooks.sh scripts/sync-notebooks-vendor.sh scripts/publish-notebooks-branch.sh
          zip_path="$(bash scripts/pack-notebooks.sh)"
          echo "zip_path=${zip_path}" >> "$GITHUB_OUTPUT"
          unzip -Z1 "$zip_path"

      - name: Publish branch notebooks and tag export commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(bash scripts/publish-notebooks-branch.sh --tag "${{ steps.pack.outputs.zip_path }}")"
          echo "Published notebooks export $sha"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: notebooks-v${{ steps.version.outputs.version }}
          name: Notebooks ${{ steps.version.outputs.version }}
          make_latest: false
          fail_on_unmatched_files: true
          files: ${{ steps.pack.outputs.zip_path }}
          body: |
            Jupyter notebooks export for Hub and local use. Not desktop installers.

            Preferred: `git clone --branch notebooks --single-branch --depth 1 https://github.com/keejkrej/lisca.git lisca-notebooks` then `bash install.sh`. Update with `bash update.sh` (git pull on this export branch).

            Airgapped / no-git: download `lisca-notebooks-${{ steps.version.outputs.version }}.zip`. The zip vendors lisca crop and transfection; install only fetches third-party wheels from PyPI.

            Tag `notebooks-v${{ steps.version.outputs.version }}` points at branch `notebooks` (export artifact), not `main`. Daily work stays on `main`.

            Desktop Studio, Aligner, and Annotator installers ship from `v*` tags, not this release.

  republish:
    name: republish-from-tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/notebooks-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout notebooks-v* tag (export tree)
        uses: actions/checkout@v4

      - name: Verify export tree (do not pack from this checkout)
        id: version
        run: |
          set -euo pipefail
          if [[ -e apps || -e crates || -e python/src || -f scripts/pack-notebooks.sh ]]; then
            echo "Tag ${GITHUB_REF_NAME} looks like a monorepo commit. notebooks-v* tags must point at branch notebooks." >&2
            exit 1
          fi
          if [[ ! -f VERSION || ! -f vendor/transfection/pyproject.toml || ! -f update.sh ]]; then
            echo "Tag ${GITHUB_REF_NAME} is missing the notebooks export layout." >&2
            exit 1
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          expected="notebooks-v${version}"
          if [[ "${GITHUB_REF_NAME}" != "$expected" ]]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match VERSION '${version}' (expected '$expected')" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Zip export tree
        id: pack
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          name="lisca-notebooks-${version}"
          mkdir -p dist "$name"
          # Copy the tag tree (zip root) excluding .git
          tar -C . --exclude .git --exclude dist --exclude "${name}" -cf - . | tar -C "$name" -xf -
          zip_path="$PWD/dist/${name}.zip"
          zip -r -X "$zip_path" "$name"
          echo "zip_path=${zip_path}" >> "$GITHUB_OUTPUT"
          unzip -Z1 "$zip_path"

      - name: Upload GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Notebooks ${{ steps.version.outputs.version }}
          make_latest: false
          fail_on_unmatched_files: true
          files: ${{ steps.pack.outputs.zip_path }}
          body: |
            Jupyter notebooks export for Hub and local use. Not desktop installers.

            Preferred: `git clone --branch notebooks --single-branch --depth 1 https://github.com/keejkrej/lisca.git lisca-notebooks` then `bash install.sh`. Update with `bash update.sh` (git pull on this export branch).

            Airgapped / no-git: download `lisca-notebooks-${{ steps.version.outputs.version }}.zip`.

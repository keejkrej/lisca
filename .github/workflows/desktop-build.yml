name: Desktop build

# Test channel. Same package, sign, and notarize steps as a stable release, but the
# installer is an Actions artifact. No tag, no GitHub Release, and no auto-update feed.

on:
  workflow_dispatch:
    inputs:
      os:
        description: Installer to build
        type: choice
        options:
          - macos
          - windows
          - linux
          - all
        default: macos

permissions:
  contents: read

jobs:
  guard:
    name: check-input
    runs-on: ubuntu-latest
    steps:
      - name: Check os
        run: |
          case "${{ inputs.os }}" in
            macos|windows|linux|all) ;;
            *) echo "::error::os must be macos, windows, linux, or all"; exit 1 ;;
          esac

  package:
    needs: guard
    uses: ./.github/workflows/desktop-package.yml
    with:
      upload_target: artifact
      os: ${{ inputs.os }}
      products: '["studio"]'
    secrets: inherit

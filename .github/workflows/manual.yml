name: User manual

# Builds the MkDocs Material user manual and deploys it to GitHub Pages.
# Enable Pages in the repository settings (Source: GitHub Actions) before
# the deploy job can succeed.

on:
  push:
    branches: [main]
    paths:
      - "manual/**"
      - "mkdocs.yml"
      - ".github/workflows/manual.yml"
  pull_request:
    paths:
      - "manual/**"
      - "mkdocs.yml"
      - ".github/workflows/manual.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Material 9.8+ prints an EOL notice; it is not a MkDocs warning.
  NO_MKDOCS_2_WARNING: "1"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build
        run: mkdocs build --strict

      - name: Setup Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

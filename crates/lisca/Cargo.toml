[package]
name = "lisca"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared Rust contracts, domain logic, and HTTP infrastructure for Lisca apps."

[lints]
workspace = true

[features]
default = ["studio"]
smart = ["dep:ort"]
studio = ["smart", "dep:mplot", "dep:lisca-transfection", "dep:rust_xlsxwriter"]

[dependencies]
axum.workspace = true
base64.workspace = true
czi-rs = { workspace = true }
image.workspace = true
nd2-rs = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tiff.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
csv.workspace = true
rayon.workspace = true
mplot = { workspace = true, optional = true }
rust_xlsxwriter = { workspace = true, optional = true }
ndarray.workspace = true
ndarray-stats.workspace = true
noisy_float.workspace = true
lisca-transfection = { workspace = true, optional = true }
lisca-workspace.workspace = true
ort = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
csv.workspace = true
serde_json.workspace = true
tempfile = "3"
tiff.workspace = true
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "lisca-crop"
path = "src/bin/lisca-crop.rs"
required-features = []

[[bin]]
name = "lisca-analyze"
path = "src/bin/lisca-analyze.rs"
required-features = ["studio"]

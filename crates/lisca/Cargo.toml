[package]
name = "lisca"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared Rust contracts, domain logic, and HTTP infrastructure for Lisca apps."

[dependencies]
specta = { workspace = true, features = ["derive", "collect"] }
axum.workspace = true
base64.workspace = true
czi-rs = { workspace = true }
image.workspace = true
imaging-smb-io.workspace = true
nd2-rs = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tiff.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
walkdir.workspace = true
smb2.workspace = true
uuid.workspace = true

[[bin]]
name = "export-typescript"
path = "src/bin/export_typescript.rs"
required-features = ["export-typescript"]

[features]
export-typescript = ["dep:specta-serde", "dep:specta-typescript"]

[dependencies.specta-serde]
workspace = true
optional = true

[dependencies.specta-typescript]
workspace = true
optional = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lisca"
version = "0.1.0"
description = "Python utilities and protocol helpers for the Lisca monorepo."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lisca contributors" }]
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3.5,<9"]

[tool.uv]
constraint-dependencies = [
  "pytest>=8.3.5,<9",
]
exclude-newer = "7 days"
default-groups = ["dev"]

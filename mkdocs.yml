# User-facing analysis manual. Developer docs stay in docs/; do not point
# docs_dir there.
site_name: LISCA user manual
site_description: How LISCA analyses time-lapse microscopy of cells on micropattern arrays.
site_url: https://keejkrej.github.io/lisca/
repo_url: https://github.com/keejkrej/lisca
repo_name: keejkrej/lisca
edit_uri: edit/main/manual/
docs_dir: manual
site_dir: site
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.footnote.tooltips

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - The workflow: workflow.md
  - Assays:
      - Transfection kinetics: assays/transfection.md
      - PI death reporter: assays/pi-death.md
      - T-cell engagement: assays/engagement.md
      - LNP binding: assays/lnp-binding.md
  - Reading the plots: plots.md
  - Troubleshooting: troubleshooting.md

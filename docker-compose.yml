# Host data: /var/lisca/{workspace,source,config} bind-mounted under /root/.
# Bootstrap: sudo ./scripts/setup-lisca-host.sh
#
# Profiles: `.env` sets COMPOSE_PROFILES=all so `docker compose up --build` starts every app.
# Single app: COMPOSE_PROFILES=studio docker compose up --build
#
# Build cache: Dockerfile uses BuildKit cache mounts (bun, cargo) and cargo-chef
# dependency layers. Requires BuildKit (default in Docker 23+). Rebuilds after
# source edits reuse registry/target/vite caches; avoid `--no-cache` unless
# debugging images.
#
# In the UI, pick workspace paths like /root/workspace/<your-run-folder> and sources under /root/source/.
# Studio profiles/memory use /root/.lisca (same layout as desktop ~/.lisca).

x-lisca-volumes: &lisca-volumes
  - ${LISCA_ROOT:-/var/lisca}/workspace:/root/workspace
  - ${LISCA_ROOT:-/var/lisca}/source:/root/source:ro

x-lisca-studio-volumes: &lisca-studio-volumes
  - ${LISCA_ROOT:-/var/lisca}/workspace:/root/workspace
  - ${LISCA_ROOT:-/var/lisca}/source:/root/source:ro
  - ${LISCA_ROOT:-/var/lisca}/config:/root/.lisca

services:
  aligner:
    profiles: [aligner, all]
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PRODUCT: aligner
        PUBLIC_PORT: 8765
    ports:
      - "8765:8765"
    environment:
      PUBLIC_PORT: 8765
    volumes: *lisca-volumes
    restart: unless-stopped

  annotator:
    profiles: [annotator, all]
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PRODUCT: annotator
        PUBLIC_PORT: 8766
    ports:
      - "8766:8766"
    environment:
      PUBLIC_PORT: 8766
    volumes: *lisca-volumes
    restart: unless-stopped

  studio:
    profiles: [studio, all]
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PRODUCT: studio
        PUBLIC_PORT: 8767
    ports:
      - "8767:8767"
    environment:
      PUBLIC_PORT: 8767
    volumes: *lisca-studio-volumes
    restart: unless-stopped

# Host data (default): /var/lisca/workspace and /var/lisca/source
# Bootstrap: sudo ./scripts/setup-lisca-host.sh
#
# Profiles: `.env` sets COMPOSE_PROFILES=all so `docker compose up --build` starts every app.
# Single app: COMPOSE_PROFILES=studio docker compose up --build
#
# Build cache: Dockerfile uses BuildKit cache mounts (bun, turbo, cargo) and turbo prune /
# cargo-chef dependency layers. Requires BuildKit (default in Docker 23+). Rebuilds after
# source edits reuse registry/target/vite caches; avoid `--no-cache` unless debugging images.
#
# In the UI, pick workspace paths like /workspace/<your-run-folder> and sources under /source/.

x-lisca-env: &lisca-env
  HOST: 0.0.0.0
  PORT: 3000
  HOME: /workspace
  RUST_LOG: info
  LISCA_FS_ROOTS: /workspace:/source

services:
  aligner:
    profiles: [aligner, all]
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PRODUCT: aligner
        PUBLIC_PORT: 8765
    ports:
      - "8765:8765"
    environment:
      <<: *lisca-env
      PUBLIC_PORT: 8765
    volumes:
      - ${LISCA_ROOT:-/var/lisca}/workspace:/workspace
      - ${LISCA_ROOT:-/var/lisca}/source:/source:ro
    restart: unless-stopped

  annotator:
    profiles: [annotator, all]
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PRODUCT: annotator
        PUBLIC_PORT: 8766
    ports:
      - "8766:8766"
    environment:
      <<: *lisca-env
      PUBLIC_PORT: 8766
    volumes:
      - ${LISCA_ROOT:-/var/lisca}/workspace:/workspace
      - ${LISCA_ROOT:-/var/lisca}/source:/source:ro
    restart: unless-stopped

  studio:
    profiles: [studio, all]
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PRODUCT: studio
        PUBLIC_PORT: 8767
    ports:
      - "8767:8767"
    environment:
      <<: *lisca-env
      PUBLIC_PORT: 8767
      LISCA_CONFIG_DIR: /config
    volumes:
      - ${LISCA_ROOT:-/var/lisca}/workspace:/workspace
      - ${LISCA_ROOT:-/var/lisca}/source:/source:ro
      - ${LISCA_ROOT:-/var/lisca}/config:/config
    restart: unless-stopped

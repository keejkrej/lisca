services:
  - type: web
    name: lisca-landing
    runtime: static
    branch: deploy/landing
    buildCommand: "true"
    autoDeployTrigger: "commit"
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    staticPublishPath: apps/landing/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

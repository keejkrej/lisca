[package]
name = "studio-server"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-neutral Rust backend for Studio hosted and desktop builds."

[lints]
workspace = true

[lib]
name = "studio_server"
path = "src/lib.rs"

[[bin]]
name = "studio-server"
path = "src/main.rs"

[features]
default = []
# Mount label-free reference and classify routes. Fluorescence assays stay available.
label-free = ["lisca/label-free"]
# Label-free plus the bundled ONNX Runtime CUDA 12 libraries.
cuda = ["label-free", "lisca/cuda"]

[dependencies]
aligner-server = { path = "../../aligner/server" }
annotator-server = { path = "../../annotator/server" }
axum.workspace = true
base64.workspace = true
lisca = { workspace = true, features = ["studio"] }
lisca-server.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tower = { workspace = true }

[package]
name = "studio-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-neutral Rust backend for Studio hosted and desktop builds."

[lints]
workspace = true

[lib]
name = "studio_server"
path = "src/lib.rs"

[[bin]]
name = "studio-server"
path = "src/main.rs"

[dependencies]
aligner-server = { path = "../../aligner/server" }
annotator-server = { path = "../../annotator/server" }
axum.workspace = true
base64.workspace = true
lisca = { workspace = true, features = ["studio"] }
lisca-server.workspace = true
serde_json.workspace = true
tokio.workspace = true

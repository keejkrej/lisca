[project]
name = "delivery"
version = "0.1.0"
description = "Delivery-specific ROI extraction and comparison workflows."
requires-python = ">=3.12"
dependencies = [
  "lisca",
  "rich>=13.9",
  "typer>=0.12",
]

[project.scripts]
delivery = "delivery.cli:main"

[build-system]
requires = ["hatchling", "pathspec<0.13"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delivery"]

[tool.uv]
package = true

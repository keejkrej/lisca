[package]
name = "annotator-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-neutral Rust backend for Annotator hosted and desktop builds."

[lints]
workspace = true

[lib]
name = "annotator_server"
path = "src/lib.rs"

[[bin]]
name = "annotator-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
lisca = { workspace = true, default-features = false, features = ["smart"] }
lisca-server.workspace = true
tokio.workspace = true

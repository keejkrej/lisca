[project]
name = "apoptosis"
version = "0.1.0"
description = "Apoptosis-specific ROI analysis and brightfield model workflows."
requires-python = ">=3.12,<3.13"
dependencies = [
  "lisca",
  "markdown-it-py<4",
  "matplotlib>=3.8",
  "nd2>=0.10",
  "numpy>=1.26",
  "pandas>=2.2.3,<2.3",
  "pillow>=11.0",
  "tifffile>=2025.3.30",
  "torch>=2.6",
  "torchvision>=0.21",
  "typer>=0.12",
]

[project.scripts]
apoptosis = "apoptosis.cli:main"

[build-system]
requires = ["hatchling>=1.27", "pathspec<0.13"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apoptosis"]

[tool.uv]
package = true

[package]
name = "aligner-server"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-neutral Rust backend for Aligner hosted and desktop builds."

[lints]
workspace = true

[lib]
name = "aligner_server"
path = "src/lib.rs"

[[bin]]
name = "aligner-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
lisca = { workspace = true, default-features = false, features = ["smart"] }
lisca-server.workspace = true
tokio.workspace = true

[dev-dependencies]
image.workspace = true
tempfile = "3"

packages:
  - "apps/*/*"
  - "packages/*"

catalog:
  effect: "4.0.0-rc.112"
  "@effect/atom-solid": "4.0.0-rc.112"
  "@types/node": "^22.15.21"
  typescript: "^5.9.2"
  vitest: 4.1.11
  "@tanstack/solid-router": "^1.169.2"
  "@tanstack/router-plugin": "^1.167.35"
  "@tailwindcss/vite": "^4.1.8"
  "vite-plugin-solid": "^2.11.0"
  "solid-js": "^1.9.0"
  "@solidjs/testing-library": "^0.8.10"
  "@kobalte/core": "^0.13.0"
  "phosphor-icons-solid": "^1.0.0"
  tailwindcss: "^4.1.8"
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  "@tauri-apps/cli": "^2.0.0"
  vite-plus: 0.3.3

overrides:
  effect: "catalog:"
  solid-js: "^1.9.0"
  vite@*: "catalog:"
  vitest@*: "catalog:"

# pnpm 12: allow lifecycle scripts only for packages that need native builds.
allowBuilds:
  core-js: true
  esbuild: true
  msgpackr-extract: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

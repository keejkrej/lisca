packages:
  - "apps/*/*"
  - "packages/*"

catalog:
  effect: "4.1.6"
  "@effect/ui": "https://pkg.pr.new/Effect-TS/ui/@effect/ui@33dbab6"
  "@effect/ui-kit": "https://pkg.pr.new/Effect-TS/ui/@effect/ui-kit@33dbab6"
  "@effect/ui-devtools": "https://pkg.pr.new/Effect-TS/ui/@effect/ui-devtools@33dbab6"
  "@effect/vitest": "4.1.6"
  "@phosphor-icons/core": "^2.1.1"
  happy-dom: "^21.0.4"
  "@types/node": "^24.19.0"
  typescript: "^5.9.2"
  vitest: 4.1.11
  "@tailwindcss/vite": "^4.1.8"
  tailwindcss: "^4.1.8"
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  "@tauri-apps/cli": "^2.0.0"
  vite-plus: 0.3.3

overrides:
  effect: "catalog:"
  "@effect/ui": "catalog:"
  "@effect/ui-kit": "catalog:"
  "@effect/ui-devtools": "catalog:"
  vite@*: "catalog:"
  vitest@*: "catalog:"

minimumReleaseAgeExclude:
  - "effect@4.1.6"
  - "@effect/vitest@4.1.6"

# pnpm 12: allow lifecycle scripts only for packages that need native builds.
allowBuilds:
  core-js: true
  esbuild: true
  msgpackr-extract: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
